services:
  postgres:
    image: postgres:16-alpine
    container_name: game-release-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: game_release_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  backend:
    build:
      context: ./backend
    container_name: game-release-backend
    env_file:
      - ./backend/.env
    environment:
      DB_USER: postgres
      DB_HOST: postgres
      DB_NAME: game_release_database
      DB_PASSWORD: postgres
      DB_PORT: 5432
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    container_name: game-release-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: